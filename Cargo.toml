[package]
name = "oxml-cli"
version = "0.0.5"
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
description = "Command-line XML querying, validation and formatting, powered by oxml"
repository = "https://github.com/sebastienrousseau/oxml-cli"
homepage = "https://github.com/sebastienrousseau/oxml-cli"
documentation = "https://docs.rs/oxml-cli"
readme = "README.md"
keywords = ["xml", "xpath", "cli", "xsd", "validate"]
categories = ["command-line-utilities", "parser-implementations"]
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]

[[bin]]
name = "oxml"
path = "src/main.rs"

[dependencies]
oxml = "0.0.5"
xmlschema = "0.0.5"

[lints.rust]
missing_docs = "warn"
unused_results = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = true
strip = true
