# MkDocs Material configuration for oxml-cli
site_name: oxml-cli
site_description: >-
  Command-line XML querying, validation, and formatting, powered by oxml.
site_url: https://sebastienrousseau.github.io/oxml-cli/
site_author: Sebastien Rousseau
copyright: Copyright &copy; 2026 <a href="https://sebastienrousseau.com/" rel="author">Sebastien Rousseau</a>

repo_url: https://github.com/sebastienrousseau/oxml-cli
repo_name: sebastienrousseau/oxml-cli
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

exclude_docs: |
  docs/README.md

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/console
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - User Guide: USER-GUIDE.md
  - Architecture: ARCHITECTURE.md
  - Namespaces: NAMESPACES.md
  - Exit Codes: EXIT-CODES.md
  - Security Model: SECURITY-MODEL.md
  - Testing: TESTING.md
  - Assurance Case: ASSURANCE-CASE.md
  - Migration from xmllint: MIGRATION-FROM-XMLLINT.md
  - Roadmap: ROADMAP.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sebastienrousseau/oxml-cli
    - icon: fontawesome/brands/mastodon
      link: https://sebastienrousseau.com
